version: '3.8'

services:
  safollow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safollow-production
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=safollow_super_secret_production_jwt_key_2026
    volumes:
      - ./safollow.db:/app/safollow.db
      - ./safollow.db-wal:/app/safollow.db-wal
      - ./safollow.db-shm:/app/safollow.db-shm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
