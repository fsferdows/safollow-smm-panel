[package]
name = "universal-smm-gateway"
version = "3.0.0"
edition = "2021"
authors = ["FS Ferdows <fsferdows@icloud.com>"]
description = "High-Performance Universal SMM Panel API Gateway & Reverse-Engineered Dispatcher in Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.7", features = ["form", "query"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
